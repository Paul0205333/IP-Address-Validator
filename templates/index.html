<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Address Validator</title>

    <link rel="stylesheet"href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <main class="container">
        <section class="validator-card">
            <div class="header">
                <div class="icon">⌁</div>
                <h1>IP Address Validator</h1>
                <p>
                    Check if an IPv4 or IPv6 address is valid.
                </p>
            </div>
            <form id="validatorForm">
                <div class="form-group">
                    <label for="ipVersion">
                        IP Version
                    </label>
                    <select id="ipVersion">
                        <option value="4">IPv4</option>
                        <option value="6">IPv6</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ipAddress">
                        IP Address
                    </label>
                    <input
                        type="text"
                        id="ipAddress"
                        placeholder="192.168.1.1"
                        autocomplete="off"
                    >
                </div>
                <button type="submit" class="validate-btn">
                    Validate Address
                </button>
            </form>
        </section>
    </main>

    <!-- Result Modal -->

    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <button
                class="modal-close"
                id="closeModal"
                type="button"
            >
                &times;
            </button>
            <div class="result-icon" id="resultIcon"></div>
            <h2 id="resultTitle">
                Valid IP Address
            </h2>
            <p id="resultMessage">
                The IP address is valid.
            </p>
            <button
                class="modal-btn"
                id="modalButton"
                type="button"
            >
                Done
            </button>
        </div>
    </div>
    <script src="{{url_for('static', filename='script.js')}}"></script>
</body>
</html>
